# Woodpecker CI Configuration (Self-Hosted Free Alternative to GitHub Actions)
pipeline:
  install:
    image: node:20
    commands:
      - npm install -g pnpm@9
      - pnpm install --frozen-lockfile

  lint-and-format:
    image: node:20
    commands:
      - pnpm format:check
      - pnpm lint

  test-suites:
    image: node:20
    environment:
      NODE_ENV: test
      AI_DEFAULT_PROVIDER: mock
      GROQ_API_KEY: mock_key
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock_key
      SUPABASE_SERVICE_ROLE_KEY: mock_key
    commands:
      - pnpm test

  build:
    image: node:20
    commands:
      - pnpm -r run build

when:
  event: [pull_request, push]
  branch: [main, 'feat/**']
