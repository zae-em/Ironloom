name: Agent PR Independent Verification CI

on:
  pull_request:
    branches:
      - main
      - 'feat/**'

env:
  NODE_ENV: test
  AI_DEFAULT_PROVIDER: mock
  GROQ_API_KEY: mock_ci_key
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: mock_anon_key
  SUPABASE_SERVICE_ROLE_KEY: mock_service_role_key

jobs:
  verify-agent-pr:
    name: Independent Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Formatting Check
        run: pnpm format:check

      - name: Static Analysis & Lint
        run: pnpm lint

      - name: Run Monorepo Test Suites
        run: pnpm test

      - name: Build All Monorepo Packages
        run: pnpm -r run build
